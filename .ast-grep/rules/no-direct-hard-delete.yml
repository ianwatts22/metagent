id: no-direct-hard-delete
language: Rust
severity: warning
message: Use the shared Trash helper for retired user-owned files; hard delete is only for temp/test scratch.
files:
  - crates/**/*.rs
rule:
  all:
    - any:
        - pattern: fs::remove_file($PATH)
        - pattern: std::fs::remove_file($PATH)
        - pattern: fs::remove_dir_all($PATH)
        - pattern: std::fs::remove_dir_all($PATH)
    - not:
        any:
          - inside:
              pattern: mod tests { $$$BODY }
              stopBy: end
          - inside:
              pattern: mod test { $$$BODY }
              stopBy: end
          - inside:
              pattern: mod unit_tests { $$$BODY }
              stopBy: end
          - inside:
              pattern: mod integration_tests { $$$BODY }
              stopBy: end
