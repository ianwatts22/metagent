name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.0). Created if it does not exist."
        required: true
        type: string

permissions:
  contents: write

env:
  SPARKLE_VERSION: "2.9.4"

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer

      - name: Install asset tooling
        run: brew install librsvg

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: apps/MetagentMenuBar/.build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('apps/MetagentMenuBar/Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-

      - name: Run tests
        working-directory: apps/MetagentMenuBar
        run: swift test --disable-sandbox

      # Developer ID is the only identity Gatekeeper accepts for a download, and
      # the only one the notary service will process. It lives in a throwaway
      # keychain so nothing leaks into the runner's login keychain.
      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "$CERTIFICATE_P12" ]]; then
            echo "MACOS_CERTIFICATE_P12 is not set." >&2
            echo "Export the Developer ID Application certificate as a .p12," >&2
            echo "base64 it, and store it as a repository secret." >&2
            exit 1
          fi
          keychain="$RUNNER_TEMP/build.keychain-db"
          keychain_password="$(uuidgen)"
          certificate="$RUNNER_TEMP/certificate.p12"

          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" \
            -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" \
            "$keychain" >/dev/null
          security list-keychain -d user -s "$keychain" login.keychain-db
          rm -f "$certificate"

          security find-identity -v -p codesigning

      - name: Build signed app bundle and CLI
        env:
          METAGENT_DISTRIBUTION_BUILD: "1"
          METAGENT_VERSION: ${{ steps.meta.outputs.version }}
          # Sparkle compares CFBundleVersion. Using the release version for it
          # keeps the comparison monotonic and makes re-running a failed release
          # produce an identical build rather than a spuriously newer one.
          METAGENT_BUILD_NUMBER: ${{ steps.meta.outputs.version }}
        run: ./scripts/build-app.sh

      - name: Notarize and staple the app
        env:
          METAGENT_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_ID }}
          METAGENT_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          METAGENT_NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./scripts/notarize.sh dist/MetagentMenuBar.app

      # Both archives are cut from the stapled bundle, so the ticket travels
      # with the download and Gatekeeper can clear it without a network round
      # trip. The DMG is the human download; the zip is what Sparkle installs.
      - name: Package disk image
        env:
          METAGENT_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_ID }}
          METAGENT_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          METAGENT_NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ./scripts/package-dmg.sh artifacts/Metagent.dmg
          ./scripts/notarize.sh artifacts/Metagent.dmg

      - name: Package update archive and CLI
        run: |
          mkdir -p artifacts/updates
          ditto -c -k --keepParent dist/MetagentMenuBar.app "artifacts/updates/Metagent.zip"
          # The bundled helper is the signed copy; the loose build product is not.
          ditto -c -k "dist/MetagentMenuBar.app/Contents/Helpers/metagent" "artifacts/metagent-cli.zip"

      - name: Generate Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "SPARKLE_PRIVATE_KEY is not set." >&2
            echo "Run Sparkle's generate_keys once and store the private key as a secret." >&2
            exit 1
          fi
          tag="${{ steps.meta.outputs.tag }}"

          curl -sSL -o "$RUNNER_TEMP/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xJf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"

          key_file="$RUNNER_TEMP/sparkle_ed_key"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"

          "$RUNNER_TEMP/sparkle/bin/generate_appcast" \
            --ed-key-file "$key_file" \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/" \
            -o artifacts/appcast.xml \
            artifacts/updates

          rm -f "$key_file"
          cat artifacts/appcast.xml

      - name: Checksum artifacts
        run: |
          cp artifacts/updates/Metagent.zip artifacts/Metagent.zip
          cd artifacts
          shasum -a 256 Metagent.dmg Metagent.zip metagent-cli.zip > checksums.txt
          cat checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "Metagent $tag" \
              --generate-notes \
              --prerelease
          fi
          gh release upload "$tag" \
            artifacts/Metagent.dmg \
            artifacts/Metagent.zip \
            artifacts/metagent-cli.zip \
            artifacts/appcast.xml \
            artifacts/checksums.txt \
            --clobber

      # The feed lives on the site rather than in the release so a bad build can
      # be pulled by editing one file, without touching the release itself.
      - name: Publish appcast to the site
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Tag-triggered checkouts are detached and shallow. Fetch main into an
          # explicit remote-tracking ref before creating the local branch.
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main
          git checkout -B main origin/main
          cp artifacts/appcast.xml public/appcast.xml
          git add public/appcast.xml
          if git diff --cached --quiet; then
            echo "Appcast unchanged."
          else
            git commit -m "chore(release): publish appcast for $tag"
            git push origin main
          fi
